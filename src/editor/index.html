<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Persa</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%237c9cff'/%3E%3Ctext x='16' y='22' font-size='18' font-family='sans-serif' text-anchor='middle' fill='%23fff'%3EP%3C/text%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #0f1012;
    --panel: #17191d;
    --panel-2: #1e2127;
    --line: #2a2e36;
    --text: #e6e8ec;
    --dim: #9aa1ad;
    --accent: #7c9cff;
    --ok: #57c97e;
    --warn: #e7b357;
    --bad: #e2695f;
    --radius: 10px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f7f9; --panel: #ffffff; --panel-2: #f1f3f6; --line: #dfe3ea;
      --text: #14161a; --dim: #626b78; --accent: #3a5bd9;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
    padding: 18px 20px; border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .02em; }
  header .file { color: var(--dim); font-size: 12.5px; font-family: ui-monospace, monospace; }
  header .spacer { flex: 1; }
  main {
    display: grid; grid-template-columns: minmax(340px, 1fr) minmax(340px, 1fr);
    gap: 16px; padding: 16px; align-items: start;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
  .panel > h2 {
    font-size: 12px; text-transform: uppercase; letter-spacing: .09em; color: var(--dim);
    margin: 0; padding: 14px 16px 0;
  }
  .panel > .body { padding: 14px 16px 18px; }
  .right { position: sticky; top: 16px; }
  label { display: block; font-size: 12.5px; color: var(--dim); margin: 14px 0 5px; }
  label:first-child { margin-top: 0; }
  input[type=text], textarea {
    width: 100%; background: var(--panel-2); color: var(--text);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
    font: inherit; resize: vertical;
  }
  textarea { min-height: 62px; font-size: 14px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .hint { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .trait { margin: 0 0 12px; }
  .trait .row { display: flex; align-items: center; gap: 10px; }
  .trait .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--dim); }
  .trait .ends b { font-weight: 500; }
  .trait input[type=range] { flex: 1; accent-color: var(--accent); }
  .trait .val { width: 34px; text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--dim); }
  .trait .phrase { font-size: 12.5px; color: var(--dim); margin-top: 3px; min-height: 1.2em; }
  .trait[data-neutral="1"] .phrase { opacity: .5; font-style: italic; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    border-radius: 999px; padding: 5px 12px; font-size: 13px; cursor: pointer;
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 16px 0; }
  .tab {
    border: 1px solid var(--line); background: transparent; color: var(--dim);
    border-radius: 8px; padding: 5px 10px; font-size: 13px; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--panel-2); color: var(--text); border-color: var(--accent); }
  pre.preview {
    margin: 0; padding: 14px 16px; background: var(--panel-2); border-radius: 8px;
    border: 1px solid var(--line);
    white-space: pre-wrap; word-wrap: break-word;
    font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
    max-height: 56vh; overflow: auto;
  }
  .meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 12.5px; color: var(--dim); margin-bottom: 10px; }
  .meta .count.ok { color: var(--ok); }
  .meta .count.warn { color: var(--warn); }
  .meta .count.bad { color: var(--bad); }
  button.action {
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 14px; font: inherit; font-size: 13.5px; cursor: pointer;
  }
  button.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button.action:disabled { opacity: .5; cursor: default; }
  .where { font-size: 12.5px; color: var(--dim); margin-top: 10px; padding-left: 12px; border-left: 2px solid var(--line); }
  .notice { font-size: 12.5px; color: var(--warn); margin-top: 8px; }
  .status { font-size: 12.5px; color: var(--dim); }
  .status.saved { color: var(--ok); }
  .status.error { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Persa</h1>
  <span class="file" id="file"></span>
  <span class="spacer"></span>
  <span class="status" id="status"></span>
  <button class="action" id="save">Save</button>
</header>

<main>
  <section class="panel">
    <h2>Who they are</h2>
    <div class="body">
      <label for="name">Name</label>
      <input type="text" id="name" placeholder="Sable" />
      <label for="tagline">One line</label>
      <input type="text" id="tagline" placeholder="a dry chief of staff who tells me the thing I don't want to hear" />
      <label for="address">Call me</label>
      <input type="text" id="address" placeholder="Tony" />
      <label for="greeting">How it opens a conversation</label>
      <input type="text" id="greeting" placeholder="no greeting, open with the answer" />

      <h2 style="padding:0;margin:22px 0 10px">Voice</h2>
      <div id="traits"></div>

      <label>Emoji</label>
      <div class="chips" id="emoji">
        <button class="chip" data-value="never" aria-pressed="false">never</button>
        <button class="chip" data-value="sparing" aria-pressed="false">sparing</button>
        <button class="chip" data-value="freely" aria-pressed="false">freely</button>
      </div>

      <h2 style="padding:0;margin:22px 0 0">Rules</h2>
      <label for="always">Always <span class="dim">(one per line)</span></label>
      <textarea id="always" placeholder="Lead with the decision, then the reasoning."></textarea>
      <label for="never">Never (one per line)</label>
      <textarea id="never" placeholder="Never use corporate filler like 'circle back'."></textarea>
      <label for="boundaries">Boundaries — outrank everything else (one per line)</label>
      <textarea id="boundaries" placeholder="Ask me before sending anything to another person."></textarea>
      <label for="notes">Wording notes (one per line)</label>
      <textarea id="notes" placeholder="Short sentences. Cut adverbs."></textarea>
      <p class="hint">Leave a slider in the middle and it says nothing at all — only the traits you actually care about reach the prompt.</p>
    </div>
  </section>

  <section class="panel right">
    <h2>What the agent sees</h2>
    <div class="tabs" id="tabs"></div>
    <div class="body">
      <div class="meta">
        <span class="count" id="count"></span>
        <span id="dropped"></span>
        <span class="spacer" style="flex:1"></span>
        <button class="action ghost" id="copy">Copy</button>
      </div>
      <pre class="preview" id="preview">Loading…</pre>
      <p class="where" id="where"></p>
      <p class="notice" id="notice" hidden></p>
    </div>
  </section>
</main>

<script type="module">
const $ = id => document.getElementById(id);
const lines = s => s.split('\n').map(x => x.trim()).filter(Boolean);
const unlines = a => (a || []).join('\n');

let state = null;      // { file, persona, traits, targets }
let renders = {};
let active = 'grok';
let dirty = false;

async function boot() {
  state = await (await fetch('/api/state')).json();
  $('file').textContent = state.file;

  $('traits').innerHTML = state.traits.map(t => `
    <div class="trait" data-trait="${t.id}">
      <div class="ends"><b>${t.id}</b><span>${t.low} → ${t.high}</span></div>
      <div class="row">
        <input type="range" min="0" max="100" step="1" value="50" id="t-${t.id}" aria-label="${t.id}" />
        <span class="val" id="v-${t.id}">50</span>
      </div>
      <div class="phrase" id="p-${t.id}"></div>
    </div>`).join('');

  $('tabs').innerHTML = state.targets.map(t =>
    `<button class="tab" data-id="${t.id}" aria-selected="${t.id === active}">${t.label}</button>`).join('');
  $('tabs').onclick = e => {
    const b = e.target.closest('.tab');
    if (!b) return;
    active = b.dataset.id;
    for (const tab of $('tabs').children) tab.setAttribute('aria-selected', String(tab.dataset.id === active));
    showPreview();
  };

  $('emoji').onclick = e => {
    const b = e.target.closest('.chip');
    if (!b) return;
    for (const c of $('emoji').children) c.setAttribute('aria-pressed', String(c === b));
    touch();
  };

  fill(state.persona);
  for (const el of document.querySelectorAll('input, textarea')) {
    el.addEventListener('input', touch);
  }
  $('save').onclick = save;
  $('copy').onclick = copy;
  window.addEventListener('beforeunload', e => { if (dirty) e.preventDefault(); });
  await preview();
}

function fill(p) {
  $('name').value = p.name || '';
  $('tagline').value = p.tagline || '';
  $('address').value = p.style?.address_user_as || '';
  $('greeting').value = p.style?.greeting || '';
  for (const t of state.traits) {
    const v = p.voice?.[t.id] ?? 50;
    $('t-' + t.id).value = v;
    $('v-' + t.id).textContent = v;
  }
  for (const c of $('emoji').children) {
    c.setAttribute('aria-pressed', String(c.dataset.value === (p.style?.emoji || 'sparing')));
  }
  $('always').value = unlines(p.rules?.always);
  $('never').value = unlines(p.rules?.never);
  $('boundaries').value = unlines(p.boundaries);
  $('notes').value = unlines(p.style?.notes);
}

function collect() {
  const voice = {};
  for (const t of state.traits) voice[t.id] = Number($('t-' + t.id).value);
  const emoji = [...$('emoji').children].find(c => c.getAttribute('aria-pressed') === 'true')?.dataset.value || 'sparing';
  return {
    persa: 1,
    name: $('name').value.trim() || 'Unnamed',
    tagline: $('tagline').value.trim(),
    voice,
    style: {
      emoji,
      address_user_as: $('address').value.trim(),
      greeting: $('greeting').value.trim(),
      notes: lines($('notes').value)
    },
    rules: { always: lines($('always').value), never: lines($('never').value) },
    boundaries: lines($('boundaries').value),
    examples: state.persona.examples || []
  };
}

let timer = null;
function touch() {
  dirty = true;
  setStatus('unsaved changes');
  for (const t of state.traits) $('v-' + t.id).textContent = $('t-' + t.id).value;
  clearTimeout(timer);
  timer = setTimeout(preview, 160);
}

async function preview() {
  const res = await fetch('/api/preview', {
    method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify(collect())
  });
  const data = await res.json();
  if (data.error) return setStatus(data.error, 'error');
  renders = data.renders;
  // Show which trait sentence each slider currently produces.
  const voiceLines = new Set((renders.plain?.text || '').split('\n').map(l => l.replace(/^- /, '')));
  for (const t of state.traits) {
    const el = $('p-' + t.id);
    const box = document.querySelector(`.trait[data-trait="${t.id}"]`);
    const hit = [...voiceLines].find(l => TRAIT_HINTS[t.id]?.test(l));
    box.dataset.neutral = hit ? '0' : '1';
    el.textContent = hit || 'neutral — says nothing';
  }
  showPreview();
}

// Cheap way to point a slider at the sentence it produced, for the live hint.
const TRAIT_HINTS = {
  warmth: /neutral\.|professional distance|Be warm|openly caring/,
  formality: /friend texting|casual and relaxed|professional and composed|formal and precise/,
  humor: /No jokes|Humor is rare|Be funny|playful and irreverent/,
  verbosity: /one or two sentences|Be brief|reasoning, not just|Explain thoroughly/,
  directness: /Be gentle|Be tactful|Be direct|Be blunt/,
  energy: /calm and level|even, unhurried|Bring some energy|enthusiastic and high-energy/,
  challenge: /Defer to me|Raise a concern once|Push back|Challenge me hard/
};

function showPreview() {
  const r = renders[active];
  const target = state.targets.find(t => t.id === active);
  if (!r) return;
  $('preview').textContent = r.text;
  $('where').textContent = target.where;
  const count = $('count');
  if (r.limit) {
    const pct = r.length / r.limit;
    count.textContent = `${r.length} / ${r.limit} characters`;
    count.className = 'count ' + (r.truncated ? 'bad' : pct > 0.9 ? 'warn' : 'ok');
  } else {
    count.textContent = `${r.length} characters`;
    count.className = 'count';
  }
  $('dropped').textContent = r.removed.length
    ? `· ${r.removed.length} line${r.removed.length > 1 ? 's' : ''} trimmed to fit`
    : '';
  const notice = $('notice');
  notice.hidden = !r.truncated;
  notice.textContent = r.truncated ? 'Too long even after trimming — shorten the rules or the tagline.' : '';
}

async function save() {
  $('save').disabled = true;
  try {
    const res = await fetch('/api/save', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(collect())
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    dirty = false;
    setStatus('saved to ' + data.file, 'saved');
  } catch (err) {
    setStatus(err.message, 'error');
  } finally {
    $('save').disabled = false;
  }
}

async function copy() {
  const text = renders[active]?.text || '';
  try {
    await navigator.clipboard.writeText(text);
    setStatus('copied ' + state.targets.find(t => t.id === active).label, 'saved');
  } catch {
    setStatus('copy blocked by the browser — select the text instead', 'error');
  }
}

function setStatus(msg, kind = '') {
  const el = $('status');
  el.textContent = msg;
  el.className = 'status ' + kind;
}

boot().catch(err => setStatus(err.message, 'error'));
</script>
</body>
</html>
